[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "Conversational data analyst agent for CSV files in Google Drive (Mistral Agents SDK)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mistralai-agents==1.1.0",
    "pandas==3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
